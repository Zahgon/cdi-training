<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title layout:fragment="title">
        Error
    </title>
</head>

<body>
<div layout:fragment="body">
    <div class="d-flex flex-column justify-content-center h-100">
        <div>
            <div class="text-center my-3">
                <i class="fas fa-exclamation-triangle fa-10x" style="color: red;"></i>
            </div>
            <div class="fs-5 my-2"><b>URI:</b> [[${uri}]] </div>
            <div class="fs-5 my-2"><b>Exception:</b> [[${exceptionType}]]</div>
            <div class="fs-5 my-2"><b>Message:</b> [[${exceptionMessage}]]</div>
        </div>
    </div>
</div>
</body>
</html>
