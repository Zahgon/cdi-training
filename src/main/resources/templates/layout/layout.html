<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<!--@elvariable id="verticallyCentered" type="java.lang.Boolean"-->
<!--@elvariable id="onWelcomePage" type="java.lang.Boolean"-->
<!--@elvariable id="onBasicIndexPage" type="java.lang.Boolean"-->
<!--@elvariable id="onAdvancedIndexPage" type="java.lang.Boolean"-->


<head>
    <link rel="stylesheet" th:href="@{/webjars/mdb-ui-kit/3.9.0/css/mdb.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/5.15.2/css/all.min.css}"/>
    <link rel="stylesheet" th:href="@{/resources/css/style.css}"/>
    <title layout:fragment="title">CDI Training</title>
</head>

<body lang="en">
    <nav id="navbar-container" class="navbar navbar-expand-lg navbar-light bg-light fixed-top shadow">
        <div class="container-fluid d-flex justify-content-between bg-light">
            <div class="navbar-brand">
                <a th:href="${cdiUri.cdiOrgUri}" target="_blank">
                    <img th:src="${pathHelper.buildResourcePath('/img/cdi-logo.png')}" height="40" alt="CDI-Logo"
                         th:title="${cdiUri.cdiOrgUri}"/>
                </a>
            </div>
            <button class="navbar-toggler" type="button" data-mdb-toggle="collapse"
                    data-mdb-target="#navLinkContent" aria-controls="navLinkContent" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="fas fa-align-justify"></span>
            </button>
            <div class="collapse navbar-collapse" style="flex-grow: 0;" id="navLinkContent">
                <div class="navbar-nav navbar-nav me-auto mb-2 mb-lg-0 w-100 d-flex flex-lg-row flex-column justify-content-end fs-5">
                    <!-- All static nav links to the welcome and main index pages -->
                    <th:block th:replace="~{fragments/navLink :: navLink('navWelcomeLink', '/welcome', 'Welcome', ${pathHelper.isOnPage('/welcome')}, null)}"></th:block>
                    <th:block th:replace="~{fragments/navLink :: navLink('navBasicLink', '/basic/index', 'Basic', ${pathHelper.isOnSubpage('/basic')}, null)}"></th:block>
                    <th:block th:replace="~{fragments/navLink :: navLink('navAdvancedLink', '/advanced/index', 'Advanced', ${pathHelper.isOnSubpage('/advanced')}, null)}"></th:block>
                </div>
            </div>
        </div>
    </nav>

    <main class="bg-image">
        <article class="main-article">
            <div th:class="${'d-flex flex-row flex-wrap justify-content-center ' + ((verticallyCentered == null or verticallyCentered) ? 'align-items-center' : '') + ' w-100 h-100'}">
                <div class="main-container">
                    <div layout:fragment="body"></div>
                </div>
            </div>
        </article>
    </main>

    <footer class="bg-light d-flex justify-content-center align-items-center shadow-inverted">
        &#169;<a href="https://www.gepardec.com/" target="_blank" class="ps-1" title="https://www.gepardec.com/">2021
        Gepardec IT Services</a>
    </footer>
    <script th:src="@{/webjars/mdb-ui-kit/3.9.0/js/mdb.min.js}"></script>
    <script th:src="@{/webjars/font-awesome/5.15.2/js/all.min.js}"></script>

    <th:block layout:fragment="bottom"></th:block>
</body>
</html>
