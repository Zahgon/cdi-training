<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--@elvariable id="id" type="java.lang.String"-->
<!--@elvariable id="title" type="java.lang.String"-->
<!--@elvariable id="rendered" type="java.lang.Boolean"-->

<section th:fragment="card(id, title, body, buttons, rendered)">
            <div th:id="${id}" th:if="${rendered == null or rendered}" class="card bg-light m-2">
                <div class="card-header text-center d-flex justify-content-center">
                    <div class="fs-3" th:text="${title}"></div>
                </div>
                <div class="card-body">
                    <div class="card-text text-start">
                        <th:block th:replace="${body}"></th:block>
                    </div>
                    <div class="text-center mt-2">
                        <th:block th:replace="${buttons}"></th:block>
                    </div>
                </div>
            </div>
        </section>
</body>
</html>
