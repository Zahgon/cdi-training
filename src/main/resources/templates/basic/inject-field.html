<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<!--@elvariable id="name" type="java.lang.String"-->

<head>
    <title layout:fragment="title">
        Inject field
    </title>
</head>

<body>
<div layout:fragment="body">

    <div class="container-lg">
        <div class="row my-2">
            <div class="col">
                <div class="text-center">
                    <h1>Inject field</h1>
                </div>
            </div>

            <hr class="my-3" />
        </div>

        <div class="row my-2">
            <div class="col">
                <h4 th:text="${name}"></h4>

                <hr class="mt-3 mb-3" />

                <p>
                    When an instance want's to use a CDI Bean, then it must be a CDI Bean itself.
                    With CDI either everything is managed by CDI or nothing at all.
                </p>

                <hr class="mt-3 mb-3" />
            </div>
        </div>
    </div>
</div>
</body>
</html>
