spring.application.name=cdi-training

# Replaces <context-root>/cditraining</context-root> from WEB-INF/jboss-web.xml
server.servlet.context-path=/cditraining
# Replaces <session-config><session-timeout>30</session-timeout></session-config> from web.xml
server.servlet.session.timeout=30m

# Thymeleaf replaces Facelets. Caching is off, mirroring
# jakarta.faces.FACELETS_REFRESH_PERIOD=0 and jakarta.faces.PROJECT_STAGE=Development.
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Replaces com.sun.faces.defaultResourceMaxAge=4838400000 (ms)
spring.web.resources.cache.period=4838400

# Replaces src/main/resources/log4j.properties
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1} - %m%n
